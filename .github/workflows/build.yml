name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unpack and Find Project Files
      run: |
        unzip -o Py2PDF_Ready.zip
        # Move files to root if nested inside any subfolder
        find . -mindepth 2 \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec dirname {} \; | while read -r dir; do
          if [ "$dir" != "." ]; then
            echo "Found project in $dir, moving contents to root..."
            cp -r "$dir"/* .
          fi
        done

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Py2PDF-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unpack Project
      run: |
        unzip -o Py2PDF_Ready.zip
        find . -mindepth 2 \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec dirname {} \; | while read -r dir; do
          if [ "$dir" != "." ]; then
            echo "Found project in $dir, moving contents to root..."
            cp -r "$dir"/* .
          fi
        done

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK directly
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Py2PDF-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
